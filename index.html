<!DOCTYPE html>
<html lang="en" data-theme="light" style="color-scheme: light;"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lost &amp; Found</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f9fb;--card:#fff;--ink:#16323a;--mute:#5d7882;--line:#d6e6eb;--acc:#0e8fa8;--accink:#fff;--chip:#e3f3f7}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1c21;--card:#152a31;--ink:#e6f2f5;--mute:#8fb0ba;--line:#244049;--acc:#3cc0da;--accink:#06222a;--chip:#1c3640}}
:root[data-theme="dark"]{--bg:#0e1c21;--card:#152a31;--ink:#e6f2f5;--mute:#8fb0ba;--line:#244049;--acc:#3cc0da;--accink:#06222a;--chip:#1c3640}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px 48px}
header{text-align:center;padding:28px 0 18px}
header h1{margin:0;font-size:1.9rem}
header p{margin:6px auto 0;color:var(--mute);max-width:560px}
.bubbles{font-size:2rem}
input,textarea,button,select{font:inherit;color:inherit}
.search{width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:1.05rem}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 18px}
.chip{border:1px solid var(--line);background:var(--chip);padding:6px 14px;border-radius:99px;cursor:pointer}
.chip.on{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.card img{width:100%;height:auto;display:block;background:var(--chip)}
.card .b{padding:12px 14px 14px}
.card h3{margin:0 0 4px;font-size:1.05rem}
.card p{margin:0 0 8px;color:var(--mute);font-size:.93rem}
.date{display:inline-block;background:var(--chip);border-radius:8px;padding:3px 9px;font-size:.85rem}
.empty{text-align:center;color:var(--mute);padding:40px 0}
.info{margin-top:28px;padding:16px;border:1px dashed var(--line);border-radius:14px;color:var(--mute);text-align:center}
.admin{background:var(--card);border:1px solid var(--acc);border-radius:16px;padding:16px;margin-bottom:22px}
.admin h2{margin:0 0 10px;font-size:1.1rem}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.row>*{flex:1 1 180px}
.admin input,.admin textarea{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.btn{background:var(--acc);color:var(--accink);border:0;padding:10px 18px;border-radius:10px;cursor:pointer;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5}
.prev{max-width:220px;border-radius:12px;display:block;margin-bottom:10px}
.small{font-size:.85rem;color:var(--mute)}
.langs{display:flex;gap:6px;justify-content:center;margin-bottom:6px}
.langs button{border:1px solid var(--line);background:var(--card);padding:6px 14px;border-radius:99px;cursor:pointer}
.langs button.on{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.call{display:inline-block;margin-top:10px;background:var(--acc);color:var(--accink);text-decoration:none;font-weight:700;font-size:1.15rem;padding:12px 22px;border-radius:12px}
.notice{max-width:560px;margin:12px auto 0;padding:10px 14px;border-radius:12px;background:var(--chip);border:1px solid var(--line);font-size:.92rem}
.acts{display:flex;gap:6px;margin-top:8px}
.acts button{font-size:.8rem;padding:5px 10px}
html{-webkit-text-size-adjust:100%}
button,a,.chip{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
img{max-width:100%}
@media (max-width:560px){
.wrap{padding:10px 12px 40px}
header{padding:12px 0 8px}
header h1{font-size:1.4rem}
header p{font-size:.95rem}
.bubbles{font-size:1.4rem}
.notice{font-size:.85rem;padding:8px 12px}
.search{padding:13px 14px}
.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card .b{padding:9px 10px 11px}
.card h3{font-size:.95rem}
.card p{font-size:.84rem;overflow-wrap:anywhere}
.date{font-size:.75rem}
.chips{flex-wrap:nowrap;overflow-x:auto;margin-left:-12px;margin-right:-12px;padding:0 12px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;flex:0 0 auto;padding:9px 15px}
.langs button{padding:9px 14px}
.btn{padding:12px 18px}
.row>*{flex:1 1 100%}
.prev{max-width:100%}
.acts button{padding:8px 10px}
}
@media (max-width:340px){.grid{grid-template-columns:1fr}}
</style>

var app=document.getElementById('app');
var isOwner=false,artifact=null,sample=null,canImg=false;
var q='',cat='All',draft=null,busy='';
var CATS=['Shirt/Top','Pants','Dress/Skirt','Jacket/Coat','Socks/Underwear','Towel/Bedding','Accessory',"Kids' clothing",'Other'];
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

var LANGS=[['en','English'],['vi','Tiếng Việt'],['es','Español']],LOC={en:'en-US',vi:'vi-VN',es:'es-US'},lang='en';
try{var sv=localStorage.getItem('lf-lang');if(sv&&LOC[sv])lang=sv;else{var nl=(navigator.language||'en').slice(0,2);if(LOC[nl])lang=nl}}catch(e){}
var T={
en:{tag:"Left something behind? Search below to see if we've got it.",ph:'Search: blue hoodie, socks, towel…',all:'All',call:'Call us',notice:'Items not claimed within 90 days will be donated to a donation center.',none:'No lost items listed right now. Check back soon!',nomatch:'No matching items. Try fewer words.',found:'Found',today:'today',yest:'yesterday',days:'{n} days ago',shop:'Lost & Found',contact:'Ask the attendant or call us to claim your item.',
 cats:{}},
vi:{tag:'Bạn để quên đồ? Hãy tìm bên dưới xem chúng tôi có giữ không.',ph:'Tìm: áo hoodie xanh, vớ, khăn…',all:'Tất cả',call:'Gọi cho chúng tôi',notice:'Đồ không được nhận lại trong vòng 90 ngày sẽ được tặng cho trung tâm quyên góp.',none:'Hiện chưa có đồ thất lạc nào. Vui lòng quay lại sau!',nomatch:'Không tìm thấy món nào phù hợp. Hãy thử ít từ hơn.',found:'Tìm thấy ngày',today:'hôm nay',yest:'hôm qua',days:'{n} ngày trước',shop:'Đồ thất lạc',contact:'Hãy hỏi nhân viên hoặc gọi cho chúng tôi để nhận lại đồ của bạn.',
 cats:{'Shirt/Top':'Áo','Pants':'Quần','Dress/Skirt':'Đầm/Váy','Jacket/Coat':'Áo khoác','Socks/Underwear':'Vớ/Đồ lót','Towel/Bedding':'Khăn/Chăn ga','Accessory':'Phụ kiện',"Kids' clothing":'Quần áo trẻ em','Other':'Khác'}},
es:{tag:'¿Olvidó algo? Busque abajo para ver si lo tenemos.',ph:'Buscar: sudadera azul, calcetines, toalla…',all:'Todos',call:'Llámenos',notice:'Los artículos que no se reclamen en un plazo de 90 días serán donados a un centro de donaciones.',none:'No hay objetos perdidos por ahora. ¡Vuelva pronto!',nomatch:'No hay resultados. Intente con menos palabras.',found:'Encontrado el',today:'hoy',yest:'ayer',days:'hace {n} días',shop:'Objetos perdidos',contact:'Pregunte al encargado o llámenos para reclamar su artículo.',
 cats:{'Shirt/Top':'Camisa/Top','Pants':'Pantalones','Dress/Skirt':'Vestido/Falda','Jacket/Coat':'Chaqueta/Abrigo','Socks/Underwear':'Calcetines/Ropa interior','Towel/Bedding':'Toalla/Ropa de cama','Accessory':'Accesorio',"Kids' clothing":'Ropa infantil','Other':'Otro'}}};
function L(){return T[lang]}
function catL(c){return c==='All'?L().all:(L().cats[c]||c)}
function itemT(i){var t=lang!=='en'&&i.tr&&i.tr[lang];return {t:(t&&t.t)||i.title,d:(t&&t.d)||i.desc}}
function shopName(){var t=lang!=='en'&&D.settings.tr&&D.settings.tr[lang];return (t&&t.n)||(lang!=='en'&&D.settings.name==='Lost & Found'?L().shop:D.settings.name)||L().shop}
function contactTxt(){var t=lang!=='en'&&D.settings.tr&&D.settings.tr[lang];return (t&&t.c)||(lang!=='en'&&D.settings.contact===T.en.contact?L().contact:D.settings.contact)}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmt(s){var p=s.split('-');return new Date(p[0],p[1]-1,p[2]).toLocaleDateString(LOC[lang],{month:'short',day:'numeric',year:'numeric'})}
function ago(s){var p=s.split('-');var n=Math.round((new Date()-new Date(p[0],p[1]-1,p[2]))/864e5);return n<=0?L().today:n===1?L().yest:L().days.replace('{n}',n)}

function render(){
  document.getElementById('shop').textContent=shopName();document.getElementById('tag').textContent=L().tag;document.getElementById('notice').textContent='ℹ️ '+L().notice;document.documentElement.lang=lang;
  var lg=document.getElementById('langs');lg.innerHTML=LANGS.map(function(l){return '<button data-l="'+l[0]+'" class="'+(l[0]===lang?'on':'')+'">'+l[1]+'</button>'}).join('');
  [].forEach.call(lg.querySelectorAll('button'),function(b){b.onclick=function(){lang=b.dataset.l;try{localStorage.setItem('lf-lang',lang)}catch(e){}render()}});
  var h='';
  if(isOwner) h+=adminHtml();
  h+='<input class="search" id="q" placeholder="'+esc(L().ph)+'" value="'+esc(q)+'">';
  h+='<div class="chips">'+['All'].concat(CATS).map(function(c){return '<button class="chip'+(c===cat?' on':'')+'" data-c="'+esc(c)+'">'+esc(catL(c))+'</button>'}).join('')+'</div>';
  var items=D.items.filter(function(i){
    if(cat!=='All'&&i.cat!==cat)return false;
    var x=itemT(i),t=(i.title+' '+i.desc+' '+i.cat+' '+x.t+' '+x.d+' '+catL(i.cat)).toLowerCase();
    return q.toLowerCase().split(/\s+/).filter(Boolean).every(function(w){return t.indexOf(w)>-1});
  }).sort(function(a,b){return b.date.localeCompare(a.date)});
  if(!items.length) h+='<div class="empty">'+(D.items.length?L().nomatch:L().none)+'</div>';
  else h+='<div class="grid">'+items.map(function(i){
    return '<div class="card"><img src="'+i.img+'" alt="'+esc(itemT(i).t)+'"><div class="b"><h3>'+esc(itemT(i).t)+'</h3><p>'+esc(itemT(i).d)+'</p><span class="date">'+esc(L().found)+' '+fmt(i.date)+' · '+ago(i.date)+'</span>'+
    (isOwner?'<div class="acts"><button class="btn ghost" data-edit="'+i.id+'">Edit</button><button class="btn ghost" data-del="'+i.id+'">Mark claimed / remove</button></div>':'')+'</div></div>';
  }).join('')+'</div>';
  h+='<div class="info">'+esc(contactTxt())+(D.settings.phone?'<br><a class="call" href="tel:'+esc(D.settings.phone.replace(/[^0-9+]/g,''))+'">📞 '+esc(L().call)+': '+esc(D.settings.phone)+'</a>':'')+'</div>';
  app.innerHTML=h;
  var qi=document.getElementById('q');
  qi.oninput=function(){q=qi.value;var pos=qi.selectionStart;render();var n=document.getElementById('q');n.focus();n.setSelectionRange(pos,pos)};
  [].forEach.call(app.querySelectorAll('[data-c]'),function(b){b.onclick=function(){cat=b.dataset.c;render()}});
  [].forEach.call(app.querySelectorAll('[data-edit]'),function(b){b.onclick=function(){editItem(b.dataset.edit)}});
  [].forEach.call(app.querySelectorAll('[data-del]'),function(b){b.onclick=function(){if(confirm('Remove this item from the list?')){D.items=D.items.filter(function(i){return i.id!==b.dataset.del});save()}}});
  if(isOwner) bindAdmin();
}

function adminHtml(){
  var h='<div class="admin"><h2>Owner: '+(draft&&draft.editId?'edit item':'add a lost item')+'</h2>';
  if(!draft){
    h+='<input type="file" id="file" accept="image/*"><p class="small">Pick a photo. A short description is written for you automatically, and you can edit it.</p>';
  }else{
    h+='<img class="prev" src="'+draft.img+'" alt="">';
    if(busy) h+='<p class="small">'+esc(busy)+'</p>';
    h+='<div class="row"><input id="dt" placeholder="Short title" value="'+esc(draft.title)+'"><select id="dc" style="padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg)">'+CATS.map(function(c){return '<option'+(c===draft.cat?' selected':'')+'>'+c+'</option>'}).join('')+'</select><input type="date" id="dd" value="'+draft.date+'"></div>';
    h+='<textarea id="dx" rows="3" placeholder="Description">'+esc(draft.desc)+'</textarea>';
    h+='<div class="row" style="margin-top:10px"><button class="btn" id="add"'+(busy?' disabled':'')+'>'+(draft.editId?'Save changes':'Add to list')+'</button>'+(sample?'<button class="btn ghost" id="retry"'+(busy?' disabled':'')+'>Describe with AI</button>':'')+'<button class="btn ghost" id="cancel">Cancel</button></div>';
  }
  h+='<details style="margin-top:12px"><summary class="small" style="cursor:pointer">Shop name &amp; contact text</summary><div class="row" style="margin-top:8px"><input id="sn" value="'+esc(D.settings.name)+'" placeholder="Shop name"><input id="sc" value="'+esc(D.settings.contact)+'" placeholder="Contact / pickup info"><input id="sp" value="'+esc(D.settings.phone||'')+'" placeholder="Phone number"></div><button class="btn ghost" id="ss">Save text</button></details></div>';
  return h;
}

function bindAdmin(){
  var f=document.getElementById('file');
  if(f) f.onchange=function(){if(f.files[0]) startDraft(f.files[0])};
  var rt=document.getElementById('retry');if(rt)rt.onclick=describe;
  var c=document.getElementById('cancel'); if(c) c.onclick=function(){draft=null;busy='';render()};
  var a=document.getElementById('add'); if(a) a.onclick=function(){
    draft.title=document.getElementById('dt').value.trim()||'Lost item';
    draft.cat=document.getElementById('dc').value;
    draft.date=document.getElementById('dd').value||today();
    draft.desc=document.getElementById('dx').value.trim();
    if(draft.editId){D.items=D.items.map(function(i){return i.id===draft.editId?{id:i.id,title:draft.title,cat:draft.cat,date:draft.date,desc:draft.desc,img:i.img,tr:i.tr}:i})}else{D.items.push({id:'i'+Date.now(),title:draft.title,cat:draft.cat,date:draft.date,desc:draft.desc,img:draft.img})}
    draft=null;save();
  };
  var s=document.getElementById('ss'); if(s) s.onclick=function(){var nn=document.getElementById('sn').value,cc=document.getElementById('sc').value;if(nn!==D.settings.name||cc!==D.settings.contact)delete D.settings.tr;D.settings.name=nn;D.settings.contact=cc;D.settings.phone=document.getElementById('sp').value.trim();save()};
}

function shrink(file){return new Promise(function(res,rej){
  var u=URL.createObjectURL(file),im=new Image();
  im.onload=function(){var m=720,r=Math.min(1,m/Math.max(im.width,im.height)),cv=document.createElement('canvas');
    cv.width=Math.round(im.width*r);cv.height=Math.round(im.height*r);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
    cv.toBlob(function(b){var fr=new FileReader();fr.onload=function(){res({blob:b,url:fr.result})};fr.readAsDataURL(b)},'image/jpeg',.78);URL.revokeObjectURL(u)};
  im.onerror=rej;im.src=u;
})}

function dataToBlob(u){var p=u.split(','),m=p[0].match(/:(.*?);/)[1],b=atob(p[1]),n=b.length,a=new Uint8Array(n);while(n--)a[n]=b.charCodeAt(n);return new Blob([a],{type:m})}
function grab(){var t=document.getElementById('dt');if(!t||!draft)return;draft.title=t.value;draft.cat=document.getElementById('dc').value;draft.date=document.getElementById('dd').value||draft.date;draft.desc=document.getElementById('dx').value}
function describe(){
  grab();
  if(!sample){busy='Type a short description below, or send the photo to Claude in chat and it will write one for you.';render();return}
  busy='Writing a description from the photo… (you may be asked to allow this once)';render();
  var pr='This is a photo of an item left behind at a self-service laundromat. Reply with ONLY a JSON object, no other text: {"title": short name (max 5 words), "category": one of '+JSON.stringify(CATS)+', "description": one or two plain sentences covering type of item, color, pattern, size/style, and any visible brand or distinctive detail. Do not guess at the owner or read any handwritten names.}';
  sample(pr,{images:draft.blob,cache:false}).then(function(r){
    var m=String(r.text).match(/\{[\s\S]*\}/);var o=JSON.parse(m[0]);
    draft.title=o.title||draft.title;draft.desc=o.description||draft.desc;if(CATS.indexOf(o.category)>-1)draft.cat=o.category;busy='';render();
  }).catch(function(e){busy=(e&&e.code==='images_unavailable')?'Photo reading is not supported in this view. Type a description, or send the photo to Claude in chat and it will write one.':'Could not auto-describe ('+((e&&e.code)||'error')+'). Type a description, or press "Describe with AI" to retry.';render()});
}
function startDraft(file){
  shrink(file).then(function(r){
    draft={img:r.url,blob:r.blob,title:'',desc:'',cat:'Other',date:today()};
    describe();
  }).catch(function(){alert('Could not read that image.')});
}
function editItem(id){
  var it=D.items.filter(function(i){return i.id===id})[0];if(!it)return;
  draft={editId:id,img:it.img,blob:dataToBlob(it.img),title:it.title,desc:it.desc,cat:it.cat,date:it.date};busy='';render();window.scrollTo(0,0);
}

function save(){
  if(!artifact){render();return}
  var clone=document.documentElement.cloneNode(true);
  clone.querySelector('#data').textContent=JSON.stringify(D).replace(/<\//g,'<\\/');
  clone.querySelector('#app').innerHTML='';
  artifact.publish('<!DOCTYPE html>\n'+clone.outerHTML).catch(function(e){
    if(e&&e.code!=='conflict') alert('Could not save ('+(e.code||'error')+'). Please try again.');
  });
}

render();
if(window.claude){
  Promise.all([claude.use('user'),claude.use('artifact'),claude.use('sample')]).then(function(r){
    var u=r[0];artifact=r[1];sample=r[2];
    isOwner=!!(u&&u.isOwner&&u.isOwner())&&!!artifact;
    if(sample&&sample.limits){return sample.limits().then(function(l){canImg=!!l.images}).catch(function(){})}
  }).then(function(){if(isOwner)render()}).catch(function(){});
}
})();
</script>


</body></html>
